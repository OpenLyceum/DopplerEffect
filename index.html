<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="initial-scale=1,user-scalable=no,maximum-scale=1"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2575ba" />
    <meta name="phet-sim-level" content="production" />

    <!-- Description metas are filled from package.json "description" by vite.config.ts. -->

    <!-- Open Graph (LMS / social share previews). Update og:url after deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Doppler Effect" />
    <meta property="og:description" content="%SIM_DESCRIPTION%" />
    <meta property="og:image" content="./icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Doppler Effect" />
    <meta name="twitter:description" content="%SIM_DESCRIPTION%" />
    <meta name="twitter:image" content="./icons/icon-512.png" />


    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Doppler Effect</title>
  </head>
  <body style="background-color: black">
    <script type="module" src="./src/main.ts"></script>
